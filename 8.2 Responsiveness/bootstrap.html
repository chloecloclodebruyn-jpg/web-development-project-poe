<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Columns | Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
  <main class="container py-4">
    <h1>Bootstrap's responsive grid</h1>
    <p>Resize the page to see each column stack on small screens.</p>
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <article class="card h-100"><div class="card-body"><h2 class="h5">A flexible feature</h2><p class="mb-0">This column fills half the row from the medium breakpoint upward.</p></div></article>
      </div>
      <div class="col-12 col-md-2">
        <article class="card h-100"><div class="card-body"><h2 class="h5">A narrow note</h2><p class="mb-0">A smaller grid column.</p></div></article>
      </div>
      <div class="col-12 col-md-4">
        <article class="card h-100"><div class="card-body"><h2 class="h5">A supporting panel</h2><p class="mb-0">The remaining columns complete the 12-column row.</p></div></article>
      </div>
    </div>
  </main>
</body>

</html>
