<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A centered Bootstrap card demonstrating a prebuilt component and local image.">
    <title>Bootstrap Card | Web Development</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <style>
      .lesson-card {
        max-width: 24rem;
      }

      .lesson-card img {
        height: 17rem;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <main class="d-flex min-vh-100 align-items-center justify-content-center bg-body-tertiary p-4">
      <article class="card lesson-card shadow-sm">
        <img src="./flower.svg" class="card-img-top" alt="Pink and yellow flowers growing in a small garden.">
        <div class="card-body">
          <p class="card-subtitle mb-2 text-body-secondary">Lesson 11.0</p>
          <h1 class="card-title h3">A little Bootstrap</h1>
          <p class="card-text">Bootstrap's card and flex utilities make it easy to create a centered, responsive layout.</p>
          <a class="btn btn-primary" href="../index.html#projects">Back to the projects</a>
        </div>
      </article>
    </main>
  </body>
</html>
